/* === Navbar Items Font Style === */   
.navbar-nav .nav-link {

.nav-link.active,
.nav-link:hover {

}

.nav-link::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -2px;

  width: 0%;
  height: 2px;
  background-color: #fac000;
  transition: width 0.3s;
}

.nav-link:hover::after,
.nav-link.active::after {
  width: 100%;
}
