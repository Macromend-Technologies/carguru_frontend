<style>
     @media (min-width: 300px) and (max-width: 575px) {
  .banner-container {
    width: 100%;
    height: 80%;   /* or fixed height */
    /* overflow: hidden; */
  }

  .banner-container img {
    width: 100%;
    height: 50%;
    object-fit: cover;    /* fills container, cropped if needed */
    object-position: center; 
  }
}
    @media (min-width: 600px) and (max-width: 1024px) {
  .banner-container {
    width: 100%;
    height: 80%;   /* or fixed height */
    /* overflow: hidden; */
  }

  .banner-container img {
    width: 100%;
    height: 50%;
    object-fit: cover;    /* fills container, cropped if needed */
    object-position: center;
  }
}
@media (min-width: 1024px) {
  .banner-row {
    display: flex !important;
    gap: 0; /* remove extra spacing between flex children */
  }

  .banner-container {
             /* all banners equal width */
    height: 70vh;         /* adjust as needed */
   
    width: 100%;
  }

  .banner-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;    /* fills container, cropped if needed */
    object-position: center;
    display: block;       /* removes inline gap */
  }
}


</style>
<body>
 <div class="banner-row">
  <div class="banner-container">
    <img src="images/left-banner.png" alt="">
  </div>
  <div class="banner-container">
    <img src="images/center-banner.png" alt="">
  </div>
  <div class="banner-container">
    <img src="images/right-banner.png" alt="">
  </div>
</div>

</body>
