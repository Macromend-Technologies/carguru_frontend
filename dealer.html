<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Dealer Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="loanflow.css">
    <link rel="stylesheet" href="style.css">

   <style>
        @media(max-width: 375px) {
            .personal{
                font-size: 20px !important;
            }
            .form-box {
    min-width: 90vw !important;
    padding: 20px 10px ;
}
label {
    font-size: 12px;
    font-weight: 500;
    display: block;
    margin-bottom: 8px;
}
.subtext
 {
    font-size: 12px !important;
    margin-bottom: 20px;
    color: #666;
}
        }
        .personal {
            font-size: 28px;
            font-weight: bold;
        }

        .subtext {
            font-size: 16px;
            margin-bottom: 20px;
            color: #666;
        }

        .stepper {
            margin-bottom: 30px;
        }

        .step-group {
            display: none;
            gap: 10px;
            margin-left: 50px !important;
            align-items: center;
        }

        .step-group.active {
            display: flex;
        }

        .circle {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            /* border: 2px solid #ccc; */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            background-color: white;
            color: #666;
        }

        .circle.active {
            border-color: #ffc107;
            background-color: #ffc107;

        }

        .lines {
            height: 2px;

            background-color: #ccc;
            flex-grow: 1;
        }

        .form-step {
            display: none;
        }

        .form-step.active {
            display: block;
        }

        .btn-nav {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container-main">
        <h1 class="personal" id="formTitle">Car Dealer Registration</h1>
        <p class="subtext mb-5 " id="formSubtext">Please complete the dealership registration process before proceeding
            further.
        </p>
        <div class="form-step active">
            <form class="form-box" onsubmit="event.preventDefault(); ">
                <h3 class="form-title">DEALERSHIP DEATILS</h3>
                <div class="form-row mb-0">
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" id="companyName" placeholder="Enter Company Name as in SSM">
                    </div>
                    <div class="form-group">
                        <label>Company Registration Number</label>
                        <input type="text" id="companyRegNo" placeholder="Enter Company Registration">
                    </div>
                </div>
                <div class="form-row mt-0">
                    <div class="form-group">
                        <label>Company Email </label>
                        <input type="email" id="companyEmail" placeholder="Enter your Email Address">
                    </div>
                    <div class="form-group">
                        <label>Name of Person-in-charge</label>
                        <input type="text" id="personInCharge" placeholder="Enter Name of Person-in-charge">
                    </div>
                </div>
                <div class="d-flex flex-column ">
                    <label>Upload SSM Document</label>
                    <label class="upload-box  upload-section mb-3">
                        <div class="upload-text">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <strong>Browse File (Front Photo)</strong>
                            <small>Drag & drop files here</small>
                        </div>
                        <input type="file" id="fileInput1" accept="application/pdf" onchange="handleFileSelect(this)"
                           hidden>
                    </label>
                </div>
                <div class="d-flex flex-column ">
                    <label>Upload eAuto / MyEG Document</label>
                    <label class="upload-box  upload-section mb-3">

                        <div class="upload-text">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <strong>Browse File (Front Photo)</strong>
                            <small>Drag & drop files here</small>
                        </div>
                        <input type="file" id="fileInput2" accept="application/pdf" onchange="handleFileSelect(this)"
                            hidden>
                    </label>
                </div>
                <div class="d-flex flex-column ">
                    <label>Upload photo of Business Premise (min. 5 pixs)</label>
                    <div class="upload-box upload-section" onclick="document.getElementById('nricFronts').click()">
                        <div class="upload-text">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <strong>Browse File (Front Photo)</strong>
                            <small>Drag & drop files here</small>
                        </div>
                        <input type="file" class="file-input d-none" id="nricFronts" accept="image/*"
                            onchange="handleFileSelect(this)">
                    </div>
                </div><br>
                <hr>
                <button id="nextBtn" class="btn btn1" onclick="changeStep(1)">Next</button>

                <p class="terms">By Continuing, I agree to CARGURU’s <a href="#">Terms</a> & <a href="#">Privacy
                        Policy</a>.</p>
            </form>
            <div class="gradient-line-side"></div>
        </div>
        <!-- step 2 -->
        <div class="form-step" id="step2">
            <div class="summary-details">
                <div id="summaryContainer"></div>
                <div class="gradient-line-side-out"></div>
            </div>
            
            <button class="btn btn-dark bg-black px-5 w-50" onclick="changeStep(1)">Confirm</button>
            <p class="terms">By Continuing, I agree to CARGURU’s <a href="#">Terms</a> & <a href="#">Privacy
                        Policy</a>.</p>

        </div>
        <!-- step-3 -->
        <div class="form-step" id="step3">
            <div class="summary-details">
                <button class="edit-btn"> PRINT &nbsp;<img src="images/print_1.png"></img></button>
                <div id="summaryContainer2"></div>
                <div class="gradient-line-side-out"></div>
            </div>
        </div>
    </div>
    <!-- Template for Personal Details Summary -->
    <template id="personalDetailsSummaryTemplate">
        <div class="summary-card">
            <div class="summary-body">
                <button class="edit-btn"> EDIT <i class="bi bi-pencil-square"></i></button>
                <div class="summary-left">
                    <h4>DEALERSHIP DETAILS</h4>
                </div>
                <div class="summary-right">
                    <div class="summary-item"><strong>Company Name:</strong> <span id="summaryCompanyName"></span></div>
                    <div class="summary-item"><strong>Company Registration No:</strong> <span
                            id="summaryCompanyReg"></span></div>
                    <div class="summary-item"><strong>Company Email:</strong> <span id="summaryEmail"></span></div>
                    <div class="summary-item"><strong>Name of Person-in-charge:</strong> <span
                            id="summaryCharge"></span></div>
                </div>
            </div>
            <div class="summary-body">
                <div class="summary-left">
                    <h4>UPLOAD DOCUMENTS</h4>
                </div>
                <div class="summary-right">
                    <div class="summary-item d-flex gap-5">
                        <div>
                            <p class="fw-bold"> SSM Doc</p>
                            <div class="preview-box-output h-75 ">
                                <div class="file-icon text-center"><img src="images/upoaded.png" alt=""></div>
                                <div class="file-name"><span id="summaryFile1"></span></div>
                            </div>
                        </div>
                        <div>
                            <p class="fw-bold"> eAuto / MyEG Doc</p>
                            <div class="preview-box-output h-75">
                                <div class="file-icon text-center"><img src="images/upoaded.png" alt=""></div>
                                <div class="file-name"><span id="summaryFile2"></span></div>
                            </div>
                        </div>
                    </div>
                    <div class="summary-item d-flex gap-5">
                        <div class="mt-5">
                            <div class="fw-bold mb-0">Premise Photos</div>
                            <div class="">
                                <div class="image-box">
                                    <img src="" id="summarypreviewNricFronts" style="max-width: 100px; display:block;">
                                    <p>Photos(5)</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="personalDetailsSummaryTemplate2">
        <div class="summary-card">
            <div class="summary-body">
                <div class="summary-left">
                    <h4>DEALERSHIP DETAILS</h4>
                </div>
                <div class="summary-right">
                    <div class="summary-item"><strong>Company Name:</strong> <span id="summaryCompanyName"></span></div>
                    <div class="summary-item"><strong>Company Registration No:</strong> <span
                            id="summaryCompanyReg"></span></div>
                    <div class="summary-item"><strong>Company Email:</strong> <span id="summaryEmail"></span></div>
                    <div class="summary-item"><strong>Name of Person-in-charge:</strong> <span
                            id="summaryCharge"></span></div>
                </div>
            </div>
            <div class="summary-body">
                <div class="summary-left">
                    <h4>UPLOAD DOCUMENTS</h4>
                </div>
                <div class="summary-right">
                    <div class="summary-item d-flex gap-5">
                        <div>
                            <p class="fw-bold"> SSM Doc</p>
                            <div class="preview-box-output h-75">
                                <div class="file-icon text-center"><img src="images/upoaded.png" alt=""></div>
                                <div class="file-name"><span id="summaryFile1"></span></div>
                            </div>
                        </div>
                        <div>
                            <p class="fw-bold"> eAuto / MyEG Doc</p>
                            <div class="preview-box-output h-75">
                                <div class="file-icon text-center"><img src="images/upoaded.png" alt=""></div>
                                <div class="file-name"><span id="summaryFile2"></span></div>
                            </div>
                        </div>
                    </div>
                    <div class="summary-item d-flex gap-5">
                        <div class="mt-5">
                            <div class="fw-bold mb-0">Premise Photos</div>
                            <div class=" ">
                                <div class="image-box">
                                    <img src="" id="summarypreviewNricFronts" style="max-width: 100px; display:block;">
                                    <p>Photos(5)</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <script src="dealer.js"></script>
</body>

</html>
