<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f8f9fa;
      font-family: Arial, sans-serif;
    }

    .appointment-box {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }

    .appointment-box h5 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }

    /* Calendar */
    .calendar {
      width: 100%;
      text-align: center;
      border-collapse: collapse;
    }

    .calendar th {
      font-size: 13px;
      font-weight: 600;
      padding: 6px;
      color: #666;
    }

    .calendar td {
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
    }

    .calendar td.today {
      background: #00b050;
      color: #fff;
    }

    .calendar td.partial {
      background: #fbe8d3;
    }

    .calendar td.booked {
      background: #f9d6d6;
    }

    .calendar td.selected {
      background: #00b050 !important;
      color: #fff !important;
      font-weight: 600;
    }

    /* Slots */
    .slot-list {
      margin-bottom: 20px;
    }

    .slot-list strong {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #333;
    }

    .slot {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      font-size: 14px;
      position: relative;
    }

    .slot:hover {
      background: #f1f1f1;
    }

    .slot.active {
      background: #00b050;
      color: #fff;
      font-weight: 500;
    }

    .slot.active::after {
      content: "✔";
      position: absolute;
      right: 12px;
      font-weight: bold;
    }

    /* Legend */
    .legend {
      margin-top: 10px;
      font-size: 13px;
    }

    .legend span {
      margin-right: 15px;
    }

    .legend-box {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 4px;
      border-radius: 3px;
    }

    .legend-partial {
      background: #fbe8d3;
    }

    .legend-booked {
      background: #f9d6d6;
    }
  </style>
</head>
<body>

<div class="container my-5">
  <div class="appointment-box shadow-sm">
    <h5>Select Your Appointment Date & Time</h5>
    <div class="row">
      
      <!-- Calendar -->
      <div class="col-md-6 border-end">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <button id="prevMonth" class="btn btn-sm btn-outline-secondary"><i class="bi bi-caret-left-fill"></i></button>
          <strong id="monthYear">Aug 2025</strong>
          <button id="nextMonth" class="btn btn-sm btn-outline-secondary"><i class="bi bi-caret-right-fill"></i></button>
        </div>
        <table class="calendar w-100">
          <thead>
            <tr>
              <th>Sun</th>
              <th>Mon</th>
              <th>Tue</th>
              <th>Wed</th>
              <th>Thu</th>
              <th>Fri</th>
              <th>Sat</th>
            </tr>
          </thead>
          <tbody id="calendarBody">
            <!-- Days dynamically injected -->
          </tbody>
        </table>

        <div class="legend">
          <span><span class="legend-box legend-partial"></span> Partial</span>
          <span><span class="legend-box legend-booked"></span> Fully Booked</span>
        </div>
      </div>

      <!-- Slots -->
      <div class="col-md-6">
        <div id="slotsContainer">
          <div class="slot-list">
            <strong>Morning slot available</strong>
            <div class="slot">10:00 - 10:30</div>
            <div class="slot">10:30 - 11:00</div>
            <div class="slot">11:00 - 11:30</div>
            <div class="slot">11:30 - 12:00</div>
          </div>

          <div class="slot-list">
            <strong>Afternoon slot available</strong>
            <div class="slot">14:00 - 14:30</div>
            <div class="slot">14:30 - 15:00</div>
            <div class="slot">15:00 - 15:30</div>
            <div class="slot">15:30 - 16:00</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const monthYear = document.getElementById("monthYear");
  const calendarBody = document.getElementById("calendarBody");
  let currentDate = new Date();

  const monthNames = [
    "Jan","Feb","Mar","Apr","May","Jun",
    "Jul","Aug","Sep","Oct","Nov","Dec"
  ];

  function renderCalendar(date) {
    const year = date.getFullYear();
    const month = date.getMonth();

    monthYear.innerText = `${monthNames[month]} ${year}`;
    
    // First day & last date of month
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    let html = "";
    let day = 1;

    for (let i = 0; i < 6; i++) { // 6 weeks grid
      html += "<tr>";
      for (let j = 0; j < 7; j++) {
        if (i === 0 && j < firstDay) {
          html += "<td></td>";
        } else if (day > lastDate) {
          html += "<td></td>";
        } else {
          let today = new Date();
          let cellClass = "";

          if (
            day === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
          ) {
            cellClass = "today";
          }

          // Example random partial/booked style
          if (day % 7 === 4) cellClass = "partial";
          if (day % 7 === 5) cellClass = "booked";

          html += `<td class="${cellClass}" data-day="${day}" data-month="${month}" data-year="${year}">${day}</td>`;
          day++;
        }
      }
      html += "</tr>";
    }

    calendarBody.innerHTML = html;

    // Add click event for dates
    document.querySelectorAll(".calendar td").forEach(td => {
      if(td.innerText.trim() !== ""){
        td.addEventListener("click", () => {
          document.querySelectorAll(".calendar td").forEach(d => d.classList.remove("selected"));
          td.classList.add("selected");
        });
      }
    });
  }

  // Init calendar
  renderCalendar(currentDate);

  // Navigation
  document.getElementById("prevMonth").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar(currentDate);
  });

  document.getElementById("nextMonth").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar(currentDate);
  });

  // Slot selection
  function enableSlotSelection() {
    document.querySelectorAll(".slot").forEach(slot => {
      slot.addEventListener("click", () => {
        document.querySelectorAll(".slot").forEach(s => s.classList.remove("active"));
        slot.classList.add("active");
      });
    });
  }

  enableSlotSelection();
</script>

</body>
</html>
