<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Book for your car inspection</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

<style>
  :root{
    --w: 720px;
    --label-w: 86px;          /* width of left inline labels */
    --h: 44px;                /* field height */
    --radius: 6px;
    --border:#E5E7EB;
    --text:#111827;
    --muted:#6B7280;
    --yellow:#FFC400;
    --grey:#E5E7EB;
    --shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  }

  body{ background:#f5f6f7; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial; }

  /* outer frame as in screenshot */
  .wrap{
    max-width: calc(var(--w) + 48px);
    margin: 28px auto;
    background:#fff;
    border:1px solid #ECECEC;
    border-radius:10px;
    box-shadow: var(--shadow);
  }
  .inner{ width: var(--w); margin: 26px auto 22px; }

  .title{
    text-transform:uppercase;
    letter-spacing:.3px;
    font-weight:800;
    text-align:center;
    color:var(--text);
    margin-bottom:18px;
  }

  /* options row (checkbox-look radios) */
  .options{ 
    display:flex;
     justify-content:center; 
     gap:28px; 
     margin-bottom:18px; }
  .option{
     display:flex; 
     align-items:center; 
     gap:10px; 
     font-weight:700; 
     color:#1F2937; 
     cursor:pointer; user-select:none; }
  .option input{ position:absolute; opacity:0; pointer-events:none; }
  .box{
    height:18px; width:18px; border:2px solid var(--border); border-radius:4px; display:grid; place-content:center;
    background:#fff; position:relative;
  }
  .box::after{
    content:""; width:10px; height:10px; background:#fff;
    clip-path: polygon(14% 44%, 0 63%, 47% 100%, 100% 18%, 82% 0, 44% 62%);
    transform: scale(1); /* tick always visible (like screenshot) */
  }
  /* selected = yellow */
  .option input:checked + .box{ background:var(--yellow); border-color:var(--yellow); }
  /* not-selected = grey fill */
  .option input:not(:checked) + .box{ background:#E6E7EB; border-color:#E6E7EB; }

  /* fields */
  .control, .select{
    height:var(--h);
    border-radius:var(--radius);
    border:1px solid var(--border);
    padding: 0 14px;
    outline:none;
    box-shadow:none;
  }
  .control:focus, .select:focus{ border-color:#D5D5D5; }

  /* custom caret for selects */
  .select{
    appearance:none; -webkit-appearance:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="black" stroke-width="2"><path d="M5 7l5 6 5-6"/></svg>');
    background-repeat:no-repeat; background-position:right 12px center; background-size:18px 18px; padding-right:42px;
  }

  /* inline labeled row */
  .group{ display:grid; grid-template-columns: var(--label-w) 1fr; align-items:center; column-gap:14px; margin-bottom:14px; }
  .label{ color:#374151; font-weight:600; }

  /* two-column rows with same inline label layout in each cell */
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  .row2 .group{ margin:0; }

  /* helper + button */
  .help{ text-align:center; color:#4B5563; font-size:14px; margin:10px 0 14px; }
  .help img{ height:18px; margin:0 6px 0 8px; vertical-align:middle; }
  .btn-black{ background:#000; color:#fff; border:none; border-radius:6px; height:44px; width:260px; font-weight:600; }
  .btn-black:hover{ background:#222; }
  .assist{ text-align:center; font-size:12px; color:#6B7280; margin-top:12px; }
  .assist a{ color:#2563EB; text-decoration:none; }

  .hidden{ display:none; }
</style>
</head>
<body>

  <div class="wrap">
    <div class="inner">
      <h3 class="title">BOOK FOR YOUR CAR INSPECTION</h3>

      <!-- options exactly like screenshot -->
      <div class="options">
        <label class="option">
          <input type="radio" name="mode" id="optCentre" checked />
          <span class="box"></span>
          CARGURU’s Inspection Centre
        </label>
        <label class="option">
          <input type="radio" name="mode" id="optMyLoc" />
          <span class="box"></span>
          My Location of choice
        </label>
      </div>

      <!-- FORM: CARGURU’S INSPECTION CENTRE (matches screenshot 2) -->
      <div id="form-centre">
        <div class="group">
          <div class="label">Location</div>
          <select class="select">
            <option selected>PT61171, Jalan Meranti Jaya, Taman Meranti Jaya, 47120 Puchong, Selangor</option>
            <option>Cyberjaya Centre</option>
            <option>Kuala Lumpur Centre</option>
          </select>
        </div>

        <div class="row2" style="margin-bottom:14px;">
          <div class="group">
            <div class="label">Date</div>
            <select class="select">
              <option selected>22 June 2025</option>
              <option>23 June 2025</option>
            </select>
          </div>
          <div class="group">
            <div class="label">Time</div>
            <select class="select">
              <option selected>3:00pm</option>
              <option>4:00pm</option>
            </select>
          </div>
        </div>

        <div class="row2">
          <div class="group">
            <div class="label">Name</div>
            <input class="control" value="Michael Wee" />
          </div>
          <div class="group">
            <div class="label">Email</div>
            <input class="control" type="email" value="michael@email.com" />
          </div>
        </div>
      </div>

      <!-- FORM: MY LOCATION OF CHOICE (matches screenshot 1) -->
      <div id="form-myloc" class="hidden">
        <div class="group">
          <div class="label">Address</div>
          <input class="control" placeholder="Address Line 1" />
        </div>
        <div class="group">
          <div class="label"></div>
          <input class="control" placeholder="Address Line 2" />
        </div>

        <div class="row2" style="margin-bottom:14px;">
          <div class="group">
            <div class="label">City</div>
            <select class="select">
              <option selected>Cyberjaya</option>
              <option>Kuala Lumpur</option>
            </select>
          </div>
          <div class="group">
            <div class="label">State</div>
            <select class="select">
              <option selected>Selangor</option>
              <option>Johor</option>
            </select>
          </div>
        </div>

        <div class="group">
          <div class="label">Postcode</div>
          <input class="control" value="63000" />
        </div>

        <div class="row2">
          <div class="group">
            <div class="label">Date</div>
            <select class="select">
              <option selected>22 June 2025</option>
            </select>
          </div>
          <div class="group">
            <div class="label">Time</div>
            <select class="select">
              <option selected>3:00pm</option>
            </select>
          </div>
        </div>

        <div class="row2">
          <div class="group">
            <div class="label">Name</div>
            <input class="control" value="Michael Wee" />
          </div>
          <div class="group">
            <div class="label">Email</div>
            <input class="control" type="email" value="michael@email.com" />
          </div>
        </div>
      </div>

      <p class="help">
        We’ll send the details of your appointment via email and
        <img alt="WhatsApp" src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"> WhatsApp
      </p>

      <div class="text-center">
        <button class="btn-black" type="button">Book Inspection</button>
      </div>

      <p class="assist">Need assistance? <a href="#">Contact Us!</a></p>
    </div>
  </div>

<script>
  const optCentre = document.getElementById('optCentre');
  const optMyLoc = document.getElementById('optMyLoc');
  const centre = document.getElementById('form-centre');
  const myloc = document.getElementById('form-myloc');

  function swap(){
    if(optCentre.checked){
      centre.classList.remove('hidden');
      myloc.classList.add('hidden');
    }else{
      myloc.classList.remove('hidden');
      centre.classList.add('hidden');
    }
  }
  optCentre.addEventListener('change', swap);
  optMyLoc.addEventListener('change', swap);
</script>

</body>
</html>
